name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANITY_TELEMETRY_DISABLED: 'true'
      # 網站建置時讀取 Sanity 已發布內容（公開資料，專案 ID 不是機密）
      PUBLIC_SANITY_PROJECT_ID: pg0x5cyw
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 格式檢查
        run: npm run format:check

      - name: 型別檢查
        run: npm run typecheck

      - name: 單元測試（Vitest）
        run: npm test

      - name: 建置網站
        run: npm run build

      - name: 建置 Studio
        run: npm run studio:build

      - name: 安裝 Playwright 瀏覽器
        # Chromium（主要測試）＋ Firefox、WebKit（Safari 核心，瀏覽器相容測試）
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: 內容檢查（禁用名稱）
        run: npm run check:content -w apps/web

      - name: E2E 測試（Playwright）
        # Sanity 內容 E2E 需要登入與 .env，只在本機跑（npm run test:e2e -w apps/studio）
        run: npm run test:e2e -w apps/web

      - name: 上傳 E2E 報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
